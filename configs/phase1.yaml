paths:
  out: reports/phase1

horizons: [1, 6, 24]
headline: 6
sweep: [1, 3, 6, 12, 24]

features:
  lags: [1, 2, 3, 6, 12, 24, 48]
  windows: [3, 6, 12, 24]
  diffs: [1, 3]
  pres_diffs: [3, 24]
  nw_window: 24
  weather_lag: 1
  stag_ws: 3.2
  rh_high: 80
  phys_window: 24

log_target: false
smear: false
select: rmse

ridge_alphas: [0.1, 1, 10, 100, 1000]

xgb:
  base:
    n_estimators: 2000
    learning_rate: 0.05
    early_stopping_rounds: 100
    tree_method: hist
    n_jobs: -1
  space:
    max_depth: [3, 4, 5, 6, 8]
    min_child_weight: [1, 5, 10, 20]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.5, 0.7, 0.9]
    reg_lambda: [0.1, 1.0, 10.0]
  n_iter: 20
  search_seed: 0
  tail_hours: 2160
  spike:
    objective: reg:quantileerror
    quantile_alpha: 0.9

ensemble_seeds: [0, 1, 2, 3, 4]
